<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El canto que acompañó mi silencio</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #1a1a1a; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            perspective: 1800px;
        }

        .book-container {
            position: relative;
            width: 350px; 
            height: 500px; 
            transition: transform 0.6s ease;
        }

        .book {
            width: 100%; height: 100%; position: relative; transform-style: preserve-3d;
        }

        .page {
            width: 100%; height: 100%; position: absolute; top: 0; left: 0;
            transform-origin: left center; transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1);
            cursor: pointer;
        }

        .front, .back {
            width: 100%; height: 100%; position: absolute; top: 0; left: 0;
            backface-visibility: hidden;
            box-shadow: inset 4px 0 10px rgba(0,0,0,0.1), 2px 2px 10px rgba(0,0,0,0.2);
        }

        .back { transform: rotateY(180deg); }
        .page.flipped { transform: rotateY(-180deg); }

        img.page-img {
            width: 100%;
            height: 100%;
            object-fit: cover; 
            border-radius: 2px;
        }

        @media (max-width: 768px) {
            .book-container {
                width: 85vw; height: 65vh; max-width: 400px; max-height: 600px;
            }
            .book-container.open-book { transform: translateX(15%); }
        }
        @media (min-width: 769px) {
            .book-container.open-book { transform: translateX(175px); }
        }
    </style>
</head>
<body>

    <div class="book-container" id="bookContainer">
        <div class="book" id="book"></div>
    </div>

    <script>
        // 1. Generador automático de las 56 páginas
        const book = document.getElementById('book');
        const totalPages = 56; // Total de imágenes
        let htmlContent = '';

        for (let i = 1; i <= totalPages; i += 2) {
            // Formatea los números para que siempre tengan dos dígitos (01, 02, etc.)
            let frontNum = i < 10 ? '0' + i : i;
            let backNum = (i + 1) < 10 ? '0' + (i + 1) : (i + 1);
            
            // Crea el bloque de la hoja
            htmlContent += `
            <div class="page" id="p${Math.ceil(i/2)}">
                <div class="front">
                    <img src="${frontNum}.png" alt="Página ${frontNum}" class="page-img">
                </div>
                <div class="back">
                    <img src="${backNum}.png" alt="Página ${backNum}" class="page-img">
                </div>
            </div>`;
        }
        
        // Inserta las páginas en el libro
        book.innerHTML = htmlContent;

        // 2. Lógica de animación y z-index
        const container = document.getElementById('bookContainer');
        const fronts = document.querySelectorAll('.front');
        const backs = document.querySelectorAll('.back');
        
        fronts.forEach((front) => {
            front.addEventListener('click', (e) => {
                e.stopPropagation();
                front.parentElement.classList.add('flipped');
                updateZIndices(); updateBookPosition();
            });
        });

        backs.forEach((back) => {
            back.addEventListener('click', (e) => {
                e.stopPropagation();
                back.parentElement.classList.remove('flipped');
                updateZIndices(); updateBookPosition();
            });
        });

        function updateZIndices() {
            const pages = document.querySelectorAll('.page');
            pages.forEach((page, index) => {
                if (page.classList.contains('flipped')) {
                    page.style.zIndex = index + 1;
                } else {
                    page.style.zIndex = pages.length - index;
                }
            });
        }

        function updateBookPosition() {
            const flippedPages = document.querySelectorAll('.page.flipped').length;
            const totalPages = document.querySelectorAll('.page').length;
            if (flippedPages > 0 && flippedPages < totalPages) {
                container.classList.add('open-book');
            } else {
                container.classList.remove('open-book');
            }
        }
        
        // Inicializar
        updateZIndices();
    </script>
</body>
</html>
