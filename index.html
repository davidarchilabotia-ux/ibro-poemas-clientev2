<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>El canto que acompañó mi silencio</title>
    <style>
        :root {
            --screen-gap: 24px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #1a1a1a; 
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Georgia', serif;
        }

        /* Contenedor principal que ocupa todo el espacio disponible */
        .page-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px 16px 110px 16px; /* Mantiene el espacio inferior para el audio */
        }

        /* La imagen se ajusta al máximo sin deformarse */
        img#current-page {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 4px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            transition: opacity 0.2s ease;
        }

        /* Zonas de clic transparentes para navegar (mitad izquierda y mitad derecha) */
        .nav-area {
            position: absolute;
            top: 0;
            height: 100%;
            width: 50%;
            z-index: 10;
            cursor: pointer;
        }
        .nav-left { left: 0; }
        .nav-right { right: 0; }

        /* Reproductor de Audio (Intacto) */
        #audio-widget {
            position: fixed;
            bottom: 16px;
            bottom: max(16px, env(safe-area-inset-bottom));
            left: 50%;
            transform: translateX(-50%);
            width: min(420px, calc(100vw - 24px));
            background: rgba(18, 24, 29, 0.95);
            border: 1px solid #dcb871;
            border-radius: 30px;
            padding: 10px 25px;
            display: flex;
            align-items: center;
            gap: 15px;
            z-index: 1000;
            box-shadow: 0 5px 20px rgba(0,0,0,0.6);
            color: #dcb871;
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        #audio-widget.hidden { 
            opacity: 0; 
            pointer-events: none; 
            transform: translate(-50%, 20px); 
        }

        #play-btn {
            background: #dcb871;
            color: #12181d;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex: 0 0 auto;
            transition: transform 0.2s;
        }

        #play-btn:active { transform: scale(0.9); }
        
        .audio-info {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-width: 0;
        }

        .audio-title {
            max-width: calc(100vw - 105px);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 15px;
            font-style: italic;
            letter-spacing: 0.5px;
        }
        .audio-subtitle { font-size: 11px; color: #a38c5b; text-transform: uppercase; letter-spacing: 1px; }

        @media (max-width: 768px) {
            #audio-widget { padding: 8px 16px; gap: 10px; }
            #play-btn { width: 35px; height: 35px; font-size: 16px; }
            .audio-title { font-size: 14px; }
        }
    </style>
</head>
<body>

    <div class="page-container">
        <!-- Zonas de navegación invisibles -->
        <div class="nav-area nav-left" id="prevBtn" title="Anterior"></div>
        <div class="nav-area nav-right" id="nextBtn" title="Siguiente"></div>
        
        <!-- Una sola imagen que cambia su origen dinámicamente -->
        <img id="current-page" src="01.jpg" alt="Página 1">
    </div>

    <div id="audio-widget" class="hidden">
        <button id="play-btn">▶</button>
        <div class="audio-info">
            <span class="audio-subtitle">Escuchando</span>
            <span class="audio-title" id="audio-title">Sonido</span>
        </div>
        <audio id="bg-audio"></audio>
    </div>

    <script>
        let currentPage = 1;
        const totalPages = 56;
        
        const pageImg = document.getElementById('current-page');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        
        const audioWidget = document.getElementById('audio-widget');
        const audioTitle = document.getElementById('audio-title');
        const bgAudio = document.getElementById('bg-audio');
        const playBtn = document.getElementById('play-btn');

        // Base de datos original
        const audioData = {
            4: { title: "Mi gata Paca", src: "01.mp3" },
            5: { title: "Mi gata Paca", src: "01.mp3" },
            6: { title: "Mirla Patiamarilla", src: "02.mp3" },
            7: { title: "Tirano melancólico", src: "03.mp3" },
            8: { title: "Loro corona azul. ", src: "04.mp3" },
            9: { title: "Colibrí chillón.", src: "05.mp3" },
            10: { title: "Colibrí chillón.", src: "05.mp3" },
            11: { title: "Copetón", src: "06.mp3" },
            12: { title: "Tangara Verde", src: "07.mp3" },
            13: { title: "Garcita bueyera", src: "08.mp3" },
            14: { title: "Alcaraván", src: "09.mp3" },
            15: { title: "Turpial Toche", src: "10.mp3" },
            16: { title: "Cóndor de los Andes", src: "11.mp3" },
            17: { title: "Guacamayo rojo", src: "12.mp3" },
            18: { title: "Flamencos rosados.", src: "13.mp3" },
            19: { title: "Mi gato Thor", src: "14.mp3" },
            20: { title: "Mi gato Thor", src: "14.mp3" },
            21: { title: "Golondrina Barranquera", src: "15.mp3" },
            22: { title: "Martín Pescador", src: "16.mp3" },
            23: { title: "Oropéndola Crestada", src: "17.mp3" },
            24: { title: "Pato Turrio Andino", src: "18.mp3" },
            25: { title: "Barranquero Andino", src: "19.mp3" },
            26: { title: "Quetzal Crestado", src: "20.mp3" },
            27: { title: "Cardenal Guajiro", src: "21.mp3" }
        };

        // Control del botón de reproducción
        playBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (bgAudio.paused) {
                bgAudio.play();
                playBtn.innerHTML = '⏸';
            } else {
                bgAudio.pause();
                playBtn.innerHTML = '▶';
            }
        });

        // Actualiza la imagen y sincroniza el audio correcto
        function updateView() {
            // Formatea el número a 01, 02, etc.
            const pageStr = currentPage < 10 ? '0' + currentPage : currentPage;
            
            // Micro-animación de transición
            pageImg.style.opacity = 0.5;
            setTimeout(() => {
                pageImg.src = pageStr + '.jpg';
                pageImg.alt = "Página " + currentPage;
                pageImg.style.opacity = 1;
            }, 100);

            // Traducción de tu lógica anterior (flippedCount) a páginas individuales
            const currentSpreadIndex = Math.ceil(currentPage / 2) - 1;

            if (audioData[currentSpreadIndex]) {
                audioWidget.classList.remove('hidden');
                if (bgAudio.getAttribute('src') !== audioData[currentSpreadIndex].src) {
                    bgAudio.src = audioData[currentSpreadIndex].src;
                    audioTitle.innerText = audioData[currentSpreadIndex].title;
                    playBtn.innerHTML = '▶';
                }
            } else {
                audioWidget.classList.add('hidden');
                bgAudio.pause();
                playBtn.innerHTML = '▶';
            }
        }

        // Eventos de navegación por clic
        prevBtn.addEventListener('click', () => {
            if (currentPage > 1) {
                currentPage--;
                updateView();
            }
        });

        nextBtn.addEventListener('click', () => {
            if (currentPage < totalPages) {
                currentPage++;
                updateView();
            }
        });

        // Eventos de navegación por teclado (flechas)
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' && currentPage < totalPages) {
                currentPage++;
                updateView();
            } else if (e.key === 'ArrowLeft' && currentPage > 1) {
                currentPage--;
                updateView();
            }
        });

        // Inicializar la primera página
        updateView();
    </script>
</body>
</html>
